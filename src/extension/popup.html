<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixelPal</title>
    <style>
      body {
        margin: 0;
        min-width: 280px;
        background: radial-gradient(circle at top, #213a66, #08101d 70%);
        color: #eff8ff;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      main {
        padding: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0 0 14px;
        line-height: 1.4;
        color: rgba(239, 248, 255, 0.8);
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 12px;
        text-decoration: none;
        color: #08111d;
        background: linear-gradient(90deg, #7ceaf9, #9ef5c9);
        clip-path: polygon(10% 0, 100% 0, 100% 88%, 90% 100%, 0 100%, 0 12%);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PixelPal</h1>
      <p>Low-poly browser companion overlay is active on the page.</p>
      <a href="options.html" target="_blank" rel="noreferrer">Open Command Deck</a>
    </main>
  </body>
</html>
